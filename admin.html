<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCS Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style nonce="{{NONCE}}">
:root {
  --bg: #070d1f; --panel: #101a38; --line: rgba(120,160,230,.2);
  --text: #e8eefc; --muted: #9fb0d4; --accent: #22d3ee; --ok: #34d399; --bad: #f87171; --warn: #fbbf24;
  --radius: 12px; --font: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); min-height: 100vh; }
.wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
h1 { font-size: 1.25rem; margin: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
.tab.active { border-color: var(--accent); color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 14px; }
.stat .n { font-size: 1.5rem; font-weight: 800; }
.stat .l { font-size: .72rem; color: var(--muted); text-transform: uppercase; }
label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 3px; }
input, textarea, select { width: 100%; background: #0a1330; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; margin-bottom: 8px; }
textarea { min-height: 160px; font-family: ui-monospace, monospace; font-size: .85rem; }
.btn { appearance: none; border: 1px solid var(--line); background: #16234a; color: var(--text); padding: 8px 14px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
.btn.primary { background: linear-gradient(135deg, #22d3ee, #3b82f6); color: #04111f; border: 0; }
.btn.danger { color: var(--bad); border-color: rgba(248,113,113,.5); }
.btn.sm { padding: 4px 10px; font-size: .8rem; }
table { width: 100%; border-collapse: collapse; font-size: .82rem; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid rgba(120,160,230,.12); vertical-align: top; }
th { color: var(--muted); font-size: .7rem; text-transform: uppercase; }
.chip { display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.ok { color: var(--ok); border-color: rgba(52,211,153,.35); }
.chip.warn { color: var(--warn); }
.chip.bad { color: var(--bad); }
.err { color: var(--bad); min-height: 1.2em; font-size: .85rem; }
.hint { font-size: .75rem; color: var(--muted); margin: 4px 0 10px; }
.toast { position: fixed; right: 14px; bottom: 14px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 10px; z-index: 50; max-width: 90vw; }
.toast.bad { border-left-color: var(--bad); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mono { font-family: ui-monospace, monospace; }
.hide { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>CCS Admin</h1>
    <div class="row">
      <span class="chip" id="who">…</span>
      <a class="btn sm" href="/">Shop</a>
    </div>
  </div>
  <div id="gate" class="panel">
    <p>Checking Telegram admin access…</p>
    <div class="err" id="gateErr"></div>
  </div>
  <div id="app" class="hide">
    <div class="tabs">
      <button class="tab active" data-v="overview" type="button">Overview</button>
      <button class="tab" data-v="add" type="button">Add cards</button>
      <button class="tab" data-v="cards" type="button">Cards</button>
      <button class="tab" data-v="users" type="button">Users</button>
      <button class="tab" data-v="orders" type="button">Orders</button>
    </div>
    <div id="view"></div>
  </div>
</div>
<script nonce="{{NONCE}}" src="/admin.js"></script>
</body>
</html>
